<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories 🤍</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #3b2d46 0%, #17151d 45%, #090a0f 100%);
      color: white;
      overflow-x: hidden;
    }

    .wrap {
      width: min(92%, 900px);
      margin: auto;
      padding: 55px 0 40px;
      text-align: center;
    }

    .heart {
      font-size: 42px;
      animation: pulse 1.8s infinite;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(32px, 8vw, 58px);
      letter-spacing: -1px;
    }

    .subtitle {
      color: #c9c3d0;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .slider {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
    }

    .slides {
      display: flex;
      transition: transform .55s ease;
    }

    .slide {
      min-width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111218;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.45);
      color: white;
      font-size: 25px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      z-index: 3;
    }

    .arrow:active { transform: translateY(-50%) scale(.92); }
    .prev { left: 14px; }
    .next { right: 14px; }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 18px 0 25px;
      flex-wrap: wrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 50%;
      background: #777;
      padding: 0;
      cursor: pointer;
    }

    .dot.active {
      width: 24px;
      border-radius: 10px;
      background: white;
    }

    .message {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      line-height: 1.7;
      color: #eee;
    }

    .counter {
      margin-top: 15px;
      color: #aaa5b1;
      font-size: 13px;
    }

    footer {
      margin-top: 30px;
      color: #77727d;
      font-size: 12px;
    }

    @keyframes pulse {
      50% { transform: scale(1.12); }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="heart">♡</div>
    <h1>Our Memories</h1>
    <div class="subtitle">A little collection of moments worth remembering ✨</div>

    <section class="slider" aria-label="Slideshow foto">
      <div class="slides" id="slides"></div>
      <button class="arrow prev" onclick="changeSlide(-1)" aria-label="Sebelumnya">‹</button>
      <button class="arrow next" onclick="changeSlide(1)" aria-label="Berikutnya">›</button>
    </section>

    <div class="dots" id="dots"></div>
    <div class="counter" id="counter"></div>

    <div class="message">
      <strong>Untuk kenangan kita 🤍</strong><br>
      Semoga setiap foto di sini selalu mengingatkan pada
      momen-momen indah yang pernah kita lewati.
    </div>

    <footer>Made with ♡</footer>
  </main>

  <script>
    // Nama file harus sama persis dengan yang ada di repository GitHub.
    const photos = [
      "IMG_7489.jpeg",
      "IMG_7539.jpeg",
      "IMG_7638.jpeg",
      "IMG_7720.jpeg",
      "IMG_7791.jpeg",
      "IMG_7821.jpeg",
      "IMG_8433.jpeg",
      "IMG_8620.jpeg"
    ];

    const slides = document.getElementById("slides");
    const dots = document.getElementById("dots");
    const counter = document.getElementById("counter");
    let current = 0;
    let timer;

    photos.forEach((file, i) => {
      const slide = document.createElement("div");
      slide.className = "slide";

      const img = document.createElement("img");
      img.src = file;
      img.alt = `Kenangan ${i + 1}`;
      img.loading = i === 0 ? "eager" : "lazy";

      slide.appendChild(img);
      slides.appendChild(slide);

      const dot = document.createElement("button");
      dot.className = "dot";
      dot.setAttribute("aria-label", `Foto ${i + 1}`);
      dot.onclick = () => showSlide(i);
      dots.appendChild(dot);
    });

    function showSlide(index) {
      current = (index + photos.length) % photos.length;
      slides.style.transform = `translateX(-${current * 100}%)`;

      [...dots.children].forEach((dot, i) => {
        dot.classList.toggle("active", i === current);
      });

      counter.textContent = `${current + 1} / ${photos.length}`;
    }

    function changeSlide(direction) {
      showSlide(current + direction);
      restartAuto();
    }

    function startAuto() {
      timer = setInterval(() => showSlide(current + 1), 4500);
    }

    function restartAuto() {
      clearInterval(timer);
      startAuto();
    }

    showSlide(0);
    startAuto();
  </script>
</body>
</html>
